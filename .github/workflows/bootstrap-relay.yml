name: Bootstrap Relay 0.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rehydrate exact Relay 0.1 candidate
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .relay-bootstrap/exact/part-00-00
            cat .relay-bootstrap/exact/part-00-01
            cat .relay-bootstrap/exact/part-00-02
            cat .relay-bootstrap/exact/part-00-03
            cat .relay-bootstrap/exact/part-00-04
            cat .relay-bootstrap/exact/part-00-05
            cat .relay-bootstrap/exact/part-00-06
            cat .relay-bootstrap/exact/part-00-07
            cat .relay-bootstrap/repaired/block-01-00
            cat .relay-bootstrap/repaired/block-01-01
            cat .relay-bootstrap/repaired/block-01-02
            cat .relay-bootstrap/repaired/block-01-03
            cat .relay-bootstrap/part-02
            head -c 10000 .relay-bootstrap/part-03
            cat .relay-bootstrap/patches/part03-10000-10999
            tail -c 5000 .relay-bootstrap/part-03
            head -c 5000 .relay-bootstrap/part-04
            cat .relay-bootstrap/patches/part04-5000-5499
            cat .relay-bootstrap/patches/part04-5500-5624
            cat .relay-bootstrap/patches/part04-5625-5686
            cat .relay-bootstrap/patches/part04-5687-5749
            cat .relay-bootstrap/patches/part04-5750-5999
            tail -c 10000 .relay-bootstrap/part-04
            cat .relay-bootstrap/part-05
            head -c 11000 .relay-bootstrap/part-06
            cat .relay-bootstrap/patches/part06-11000-14999
            cat .relay-bootstrap/patches/part06-15000-15999
            cat .relay-bootstrap/part-07
          } > /tmp/relay-candidate.b64

          test "$(wc -c < /tmp/relay-candidate.b64)" -eq 112196
          base64 -d /tmp/relay-candidate.b64 > /tmp/relay-candidate.zip
          echo "2f9df315de5d9d07904f33bd9f3edf09eb6670d3cf1384443f3b3ee71e64e139  /tmp/relay-candidate.zip" | sha256sum -c -

          rm -rf /tmp/relay-candidate
          mkdir -p /tmp/relay-candidate
          unzip -q /tmp/relay-candidate.zip -d /tmp/relay-candidate

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/relay-candidate/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish Relay 0.1 verification candidate"
          git push origin HEAD:main
