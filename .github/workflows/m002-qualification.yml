name: relay-m002-qualification

# Relay 0.2 / RLY-0.2-M-002 qualification on a feature branch.
#
# `release-verification.yml` deliberately runs only for `main` (pushes and PRs
# targeting it). The M-002 stack is based on `arena/01a0dd5f-relay`, so it can
# never trigger that workflow, and the sandbox that produced the branch has no
# Docker or browser. This workflow therefore runs the same real-runtime gates on
# the stacked branch: real PostgreSQL, a real Docker Compose deployment, a real
# Chrome browser, production E2E, container restart recovery and the
# PostgreSQL worker concurrency qualification.
#
# It also commits a machine-readable evidence record to
# `docs/qualification/M-002-latest.md` so the result is auditable from the
# repository itself. The evidence commit carries `[skip-qualification]` in its
# message, which stops the push event from re-triggering this workflow.

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-m002-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m002-qualification:
    if: ${{ !contains(github.event.head_commit.message, '[skip-qualification]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay_test_password@127.0.0.1:5432/relay_test
      POSTGRES_PASSWORD: relay_compose_password
      APP_ORIGIN: http://127.0.0.1:4000
      COOKIE_SECURE: "false"
      ALERT_INGEST_KEY: relay-ci-alert-key-not-production
      INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEED_ADMIN_EMAIL: admin@relay.local
      SEED_ADMIN_PASSWORD: relay-ci-seed-password-123
      SEED_ORG_NAME: Relay CI
      RELAY_VERIFY_BASE_URL: http://127.0.0.1:4000
      RELAY_VERIFY_STATE_FILE: /tmp/relay-production-e2e.json
      RELAY_EVIDENCE_DIR: /tmp/relay-qualification-evidence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare evidence directory
        run: mkdir -p "$RELAY_EVIDENCE_DIR"

      - name: Clean dependency install
        run: npm ci

      - name: Record tool versions
        shell: bash
        run: |
          {
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "docker: $(docker --version)"
            echo "compose: $(docker compose version --short)"
            echo "postgres service image: postgres:16-alpine"
            echo "google-chrome: $(/usr/bin/google-chrome --version)"
          } | tee "$RELAY_EVIDENCE_DIR/00-versions.txt"

      - name: Dependency audit
        shell: bash
        run: npm audit --audit-level=high 2>&1 | tee "$RELAY_EVIDENCE_DIR/01-audit.txt"

      - name: Build
        shell: bash
        run: npm run build 2>&1 | tee "$RELAY_EVIDENCE_DIR/02-build.txt"

      - name: Fresh PostgreSQL migration
        shell: bash
        run: npm run migrate 2>&1 | tee "$RELAY_EVIDENCE_DIR/03-migrate.txt"

      - name: Automated tests with PostgreSQL contract
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RELAY_EVIDENCE_DIR/04-tests.txt"
          grep -E '^# (tests|suites|pass|fail|cancelled|skipped|todo) ' "$RELAY_EVIDENCE_DIR/04-tests.txt" \
            | tee "$RELAY_EVIDENCE_DIR/04-tests-summary.txt"

      - name: Relay 0.1 to 0.2 migration upgrade contract (002 → 003)
        shell: bash
        run: |
          set -o pipefail
          npm run verify:migration 2>&1 | tee "$RELAY_EVIDENCE_DIR/05-migration-upgrade.txt"

      - name: Real-PostgreSQL worker concurrency, lease and restart qualification
        shell: bash
        run: |
          set -o pipefail
          node --test tests/worker.qualification.test.mjs 2>&1 | tee "$RELAY_EVIDENCE_DIR/06-worker-qualification.txt"

      - name: On-call determinism under a non-UTC process timezone
        shell: bash
        run: |
          set -o pipefail
          TZ=Pacific/Kiritimati node --test tests/oncall.test.mjs 2>&1 \
            | tee "$RELAY_EVIDENCE_DIR/07-oncall-non-utc.txt"

      - name: Secret scan
        shell: bash
        run: npm run check:secrets 2>&1 | tee "$RELAY_EVIDENCE_DIR/08-secret-scan.txt"

      - name: Build Relay Docker image
        shell: bash
        run: docker compose build --no-cache relay 2>&1 | tail -40 | tee "$RELAY_EVIDENCE_DIR/09-image-build.txt"

      - name: Start Docker Compose deployment
        shell: bash
        run: |
          docker compose up -d --quiet-pull 2>&1 | tee "$RELAY_EVIDENCE_DIR/10-compose-up.txt"

      - name: Inspect containers
        shell: bash
        run: docker compose ps --format json | tee "$RELAY_EVIDENCE_DIR/11-compose-ps.txt"

      - name: Wait for Relay health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health >/tmp/relay-health.json 2>/dev/null; then
              curl --fail --silent http://127.0.0.1:4000/api/v1/health 2>/dev/null | tee "$RELAY_EVIDENCE_DIR/12-health.txt"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color relay postgres
          exit 1

      - name: Verify UI and API reachability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:4000/ | grep -qi relay
          curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/openapi.json >/tmp/openapi.json
          echo "index.html served; openapi.json $(wc -c </tmp/openapi.json) bytes" \
            | tee "$RELAY_EVIDENCE_DIR/13-reachability.txt"

      - name: Verify reported release version, OpenAPI surface and operator hooks
        shell: bash
        run: |
          set -o pipefail
          npm run verify:surface 2>&1 | tee "$RELAY_EVIDENCE_DIR/14-release-surface.txt"

      - name: Real-browser boot, delivery and escalation verification
        env:
          RELAY_BROWSER: /usr/bin/google-chrome
          RELAY_BROWSER_SCREENSHOT_DIR: /tmp/relay-browser-smoke
        shell: bash
        run: |
          set +e
          npm run verify:browser > /tmp/relay-browser-smoke.log 2>&1
          code=$?
          cp /tmp/relay-browser-smoke.log "$RELAY_EVIDENCE_DIR/15-browser-smoke.txt"
          if [ "$code" -ne 0 ]; then
            grep -E '^FAIL' /tmp/relay-browser-smoke.log | sed 's/^/::error::/' | head -10
            tail -c 3200 /tmp/relay-browser-smoke.log | tr '\n' '~' | sed 's/^/::error::smoke-tail| /'
          else
            grep -E '^(PASS|OK|Summary|Results)' /tmp/relay-browser-smoke.log | tail -5
          fi
          exit $code

      - name: Production PostgreSQL-backed E2E (delivery audit, attempts, retry, escalation)
        shell: bash
        run: |
          set -o pipefail
          npm run verify:production 2>&1 | tee "$RELAY_EVIDENCE_DIR/16-production-e2e.txt"

      - name: Restart Relay application container
        shell: bash
        run: docker compose restart relay 2>&1 | tee "$RELAY_EVIDENCE_DIR/17-restart.txt"

      - name: Wait for Relay after restart
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1; then
              echo "relay healthy after restart (attempt $attempt)" | tee "$RELAY_EVIDENCE_DIR/18-health-after-restart.txt"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color relay postgres
          exit 1

      - name: Verify delivery, attempt and escalation persistence after restart
        shell: bash
        run: |
          set -o pipefail
          npm run verify:restart 2>&1 | tee "$RELAY_EVIDENCE_DIR/19-restart-verification.txt"

      - name: Final container state
        shell: bash
        run: docker compose ps --format json | tee "$RELAY_EVIDENCE_DIR/20-compose-ps-final.txt"

      - name: Commit qualification evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/qualification
          {
            echo "# RLY-0.2-M-002 qualification evidence"
            echo
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit under test: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Runner: \`${{ runner.os }}\` with Docker Compose, \`postgres:16-alpine\` and a real Google Chrome"
            echo
            echo "Every gate below ran against the real runtime (PostgreSQL, Docker Compose, Chrome);"
            echo "no gate in this record was skipped."
            echo
          } > docs/qualification/M-002-latest.md
          for file in "$RELAY_EVIDENCE_DIR"/*.txt; do
            name="$(basename "$file" .txt)"
            {
              echo "## $name"
              echo
              echo '```text'
              cat "$file"
              echo '```'
              echo
            } >> docs/qualification/M-002-latest.md
          done
          {
            echo "## 21-qualification-suite"
            echo
            echo '```text'
            echo "build: PASS"
            echo "tests: $(grep -E '^# pass ' "$RELAY_EVIDENCE_DIR/04-tests.txt" | head -1) / $(grep -E '^# fail ' "$RELAY_EVIDENCE_DIR/04-tests.txt" | head -1)"
            echo "migration upgrade contract: $(grep -c '^ok ' "$RELAY_EVIDENCE_DIR/05-migration-upgrade.txt") ok lines"
            echo "worker qualification: $(grep -c '^ok ' "$RELAY_EVIDENCE_DIR/06-worker-qualification.txt") ok lines"
            echo "oncall non-UTC: $(grep -E '^# (pass|fail) ' "$RELAY_EVIDENCE_DIR/07-oncall-non-utc.txt" | tr '\n' ' ')"
            echo "browser smoke: $(grep -cE '^(OK|PASS) ' "$RELAY_EVIDENCE_DIR/15-browser-smoke.txt") ok lines, $(grep -cE '^FAIL ' "$RELAY_EVIDENCE_DIR/15-browser-smoke.txt") fail lines"
            echo "production e2e: $(grep -cE '^(OK|PASS) ' "$RELAY_EVIDENCE_DIR/16-production-e2e.txt") ok lines, $(grep -cE '^FAIL ' "$RELAY_EVIDENCE_DIR/16-production-e2e.txt") fail lines"
            echo "restart verification: $(grep -cE '^(OK|PASS) ' "$RELAY_EVIDENCE_DIR/19-restart-verification.txt") ok lines, $(grep -cE '^FAIL ' "$RELAY_EVIDENCE_DIR/19-restart-verification.txt") fail lines"
            echo '```'
          } >> docs/qualification/M-002-latest.md
          git config user.name "relay-qualification[bot]"
          git config user.email "relay-qualification[bot]@users.noreply.github.com"
          git add docs/qualification/M-002-latest.md
          if git diff --cached --quiet; then
            echo "evidence unchanged"
            exit 0
          fi
          git commit -q -m "docs: record RLY-0.2-M-002 qualification evidence [skip-qualification]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color relay postgres || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
