name: tag-relay-v0.1.0

on:
  workflow_run:
    workflows: ["release-verification"]
    types: [completed]

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Guard the historical v0.1.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            echo "v0.1.0 is missing; it must not be recreated outside the original release flow."
            exit 1
          fi
          PINNED=4dc0b63b3c5eb13d9c4c0d73b4355ec65b1a2c4c
          actual="$(git rev-list -n 1 v0.1.0)"
          if [ "$actual" != "$PINNED" ]; then
            echo "v0.1.0 moved: resolves to $actual but must stay pinned to $PINNED."
            exit 1
          fi
          echo "v0.1.0 remains pinned to the verified Relay 0.1 commit $PINNED; main may advance independently."
