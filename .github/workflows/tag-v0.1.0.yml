name: tag-relay-v0.1.0

on:
  workflow_run:
    workflows: ["release-verification"]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create v0.1.0
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.1.0 >/dev/null; then
            test "$(git rev-list -n 1 v0.1.0)" = "$VERIFIED_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.0 "$VERIFIED_SHA" -m "Relay 0.1.0"
          git push origin refs/tags/v0.1.0
