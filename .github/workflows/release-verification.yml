name: release-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-0.1-release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relay_test
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://relay:relay_test_password@127.0.0.1:5432/relay_test
      POSTGRES_PASSWORD: relay_compose_password
      APP_ORIGIN: http://127.0.0.1:4000
      COOKIE_SECURE: "false"
      ALERT_INGEST_KEY: relay-ci-alert-key-not-production
      INTEGRATION_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SEED_ADMIN_EMAIL: admin@relay.local
      SEED_ADMIN_PASSWORD: relay-ci-seed-password-123
      SEED_ORG_NAME: Relay CI
      RELAY_VERIFY_BASE_URL: http://127.0.0.1:4000
      RELAY_VERIFY_STATE_FILE: /tmp/relay-production-e2e.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fresh PostgreSQL migration
        run: npm run migrate

      - name: Automated tests with PostgreSQL contract
        run: npm test

      - name: Explicit PostgreSQL schema contract
        run: node --test --test-concurrency=1 tests/postgres.contract.test.mjs

      - name: Secret scan
        run: npm run check:secrets

      - name: Build Relay Docker image
        run: docker compose build --no-cache relay

      - name: Start Docker Compose deployment
        run: docker compose up -d

      - name: Inspect containers
        run: docker compose ps

      - name: Wait for Relay health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health >/tmp/relay-health.json; then
              cat /tmp/relay-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color relay postgres
          exit 1

      - name: Verify UI and API reachability
        run: |
          curl --fail --silent --show-error http://127.0.0.1:4000/ | grep -qi relay
          curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/openapi.json >/tmp/openapi.json

      - name: Real-browser boot and routing verification
        env:
          RELAY_BROWSER: /usr/bin/google-chrome
          RELAY_BROWSER_SCREENSHOT_DIR: /tmp/relay-browser-smoke
        run: |
          set +e
          npm run verify:browser > /tmp/relay-browser-smoke.log 2>&1
          code=$?
          grep -E '^FAIL' /tmp/relay-browser-smoke.log | sed 's/^/::error::/' | head -10
          tail -c 3200 /tmp/relay-browser-smoke.log | tr '\n' '~' | sed 's/^/::error::smoke-tail| /'
          exit $code

      - name: Production PostgreSQL-backed E2E
        run: npm run verify:production

      - name: Restart Relay application container
        run: docker compose restart relay

      - name: Wait for Relay after restart
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color relay postgres
          exit 1

      - name: Verify persistence after restart
        run: npm run verify:restart

      - name: Final container state
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color relay postgres || true

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
