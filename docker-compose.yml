services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  relay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      DATABASE_URL: postgres://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-relay_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALERT_INGEST_KEY: ${ALERT_INGEST_KEY}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@relay.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-in-local-development}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-Relay Demo}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  relay-postgres:
